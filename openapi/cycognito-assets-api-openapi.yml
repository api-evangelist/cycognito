                    anyOf:
                    - type: string
                    - type: 'null'
                    example: RSA
                  range:
                    description: A range of IP addresses (e.g., `1.1.1.1-2.2.2.2`), corresponding to the **IP Range** column in the Asset List.
                    type: string
                    example: 1.1.1.1-2.2.2.2
                  range-description:
