                      items:
                        anyOf:
                        - type: string
                        - type: 'null'
                    - type: 'null'
                    example: Central Asia
                  registered-org-name:
                    description: The name of the organization as it appears in the Whois database.
                    anyOf:
                    - type: string
                    - type: 'null'
                    example: WEBSERVER-AS-AP
                  registrant:
                    description: The company that holds or owns the domain.
                    anyOf:
                    - type: string
                    - type: 'null'
                    example: acme
