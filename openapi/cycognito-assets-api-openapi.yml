                                - type: 'null'
                              scan-status:
                                anyOf:
                                - type: string
                                - type: 'null'
                              ports:
                                anyOf:
                                - type: array
                                  items:
                                    anyOf:
                                    - type: string
                                    - type: integer
                                    - type: 'null'
                                - type: 'null'
                              first-seen:
                                anyOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                                - type: string
                              last-seen:
                                anyOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                                - type: string
                              evidence:
                                anyOf:
                                - $ref: '#/components/schemas/json.any?'
                                - type: 'null'
                              banners:
                                anyOf:
                                - type: array
                                  items:
                                    anyOf:
                                    - type: object
                                      properties:
                                        port:
                                          anyOf:
                                          - type: string
                                          - type: 'null'
                                        banner:
                                          anyOf:
                                          - type: string
                                          - type: 'null'
                                      required:
                                      - port
                                      - banner
                                    - type: 'null'
                                - type: 'null'
