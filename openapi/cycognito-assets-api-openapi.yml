                      - type: 'null'
                      example: "{\n      \"http://1.2.3.4/\": \"https://foo.bar.com/abc-1d23e4fg5hi67j8k\"\n    }"
                    revalidation-request-time:
                      description: Indicates the date and time at which an issue revalidation was requested.
                      anyOf:
                      - type: string
                        format: date-time
