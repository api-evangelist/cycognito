                    tech-owners:
                      description: The names of the technical owners of a specific asset or organization, or of an asset or organization affected by a specific issue.
                      anyOf:
                      - type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            email:
                              type: string
                            org-name:
                              type: string
                          required:
