aid: cycognito
name: CyCognito
description: 'CyCognito is a cybersecurity company providing an external attack surface
  management (EASM) and exposure management platform. Its cloud-native platform continuously
  discovers, maps, and tests an organization''s internet-exposed assets—domains, IPs,
  web apps, APIs, and cloud environments—to surface and validate critical exposures
  before attackers exploit them. The CyCognito API V1 is a REST API (API-key authenticated)
  that lets you query assets and issues, manage attack-surface scope, attribute assets
  to organizations, manage users and cloud connectors, run exports and executive reports,
  and verify the identity of scanner IPs. CyCognito is backed by Accel and Lightspeed
  Venture Partners.'
